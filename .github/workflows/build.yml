name: Build FINE Photo Editor

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Find ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found."
            ls -la
            exit 1
          fi

          echo "ZIP found: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract ZIP
        run: |
          rm -rf project
          mkdir -p project

          unzip -q "$ZIP_FILE" -d project

          echo "ZIP contents:"
          find project -maxdepth 8 -type f | sort

      - name: Find Android project root
        run: |
          SETTINGS=$(find project -type f \( \
            -name "settings.gradle.kts" -o \
            -name "settings.gradle" \
          \) | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo ""
            echo "ERROR: Android project files were not found."
            echo ""
            echo "Files extracted from ZIP:"
            find project -maxdepth 10 -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo ""
          echo "Android project found:"
          echo "$PROJECT_DIR"
          echo ""

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Check Android project
        run: |
          echo "Project directory:"
          echo "$PROJECT_DIR"

          echo ""
          echo "Project files:"
          find "$PROJECT_DIR" -maxdepth 5 -type f | sort

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ] && \
             [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo ""
            echo "ERROR: app Gradle file not found."
            exit 1
          fi

      - name: Fix Compose tab code
        run: |
          FILE="$PROJECT_DIR/app/src/main/java/com/finephoto/editor/MainActivity.kt"

          if [ ! -f "$FILE" ]; then
            echo "ERROR: MainActivity.kt not found."
            exit 1
          fi

          python3 <<'PY'
          import os
          import re

          file_path = os.path.join(
              os.environ["PROJECT_DIR"],
              "app/src/main/java/com/finephoto/editor/MainActivity.kt"
          )

          with open(file_path, "r", encoding="utf-8") as f:
              text = f.read()

          # Remove unsupported tab indicator block.
          text = re.sub(
              r'\s*indicator\s*=\s*\{[^{}]*TabRowDefaults\.SecondaryIndicator[^{}]*\{[^{}]*\}[^{}]*\}[^{}]*\}',
              '',
              text,
              flags=re.DOTALL
          )

          # Remove any remaining unsupported references.
          text = re.sub(
              r'(?m)^.*TabRowDefaults\.SecondaryIndicator.*$',
              '',
              text
          )

          text = re.sub(
              r'(?m)^.*tabIndicatorOffset\(.*$',
              '',
              text
          )

          with open(file_path, "w", encoding="utf-8") as f:
              f.write(text)

          print("Compose tab compatibility fix applied.")
          PY

      - name: Build Debug APK
        run: |
          cd "$PROJECT_DIR"

          echo "Building APK..."

          gradle --no-daemon clean assembleDebug

      - name: Verify APK
        run: |
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo ""
          echo "======================================"
          echo "BUILD SUCCESSFUL"
          echo "======================================"

          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FinePhotoEditor-Debug
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
