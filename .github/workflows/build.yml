name: Build FINE Photo Editor

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle 8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Extract Android project
        run: |
          rm -rf project
          mkdir project

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found"
            ls -la
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d project

          echo "Project files:"
          find project -maxdepth 5 -type f | sort

      - name: Fix Compose tab indicator
        run: |
          FILE=project/app/src/main/java/com/finephoto/editor/MainActivity.kt

          echo "Fixing tab indicator..."

          sed -i 's/SecondaryIndicator/TabRowDefaults.SecondaryIndicator/g' "$FILE"

          echo "Checking remaining tab indicator references:"
          grep -n "SecondaryIndicator\|tabIndicatorOffset" "$FILE" || true

      - name: Build Debug APK
        run: |
          cd project
          gradle --no-daemon clean assembleDebug

      - name: Verify APK
        run: |
          test -f project/app/build/outputs/apk/debug/app-debug.apk
          ls -lh project/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FinePhotoEditor-Debug
          path: project/app/build/outputs/apk/debug/app-debug.apk
