name: Build FINE Photo Editor

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle 8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Find and extract ZIP
        run: |
          set -e

          rm -rf project
          mkdir -p project

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found."
            ls -la
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"

          unzip -q "$ZIP_FILE" -d project

          echo "Extracted files:"
          find project -maxdepth 6 -type f | sort

      - name: Locate Android project
        run: |
          set -e

          SETTINGS=$(find project -name "settings.gradle.kts" -type f | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle.kts not found."
            find project -maxdepth 8 -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Android project:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Fix MainActivity
        run: |
          set -e

          FILE="$PROJECT_DIR/app/src/main/java/com/finephoto/editor/MainActivity.kt"

          if [ ! -f "$FILE" ]; then
            echo "ERROR: MainActivity.kt not found."
            exit 1
          fi

          echo "Applying Compose compatibility fixes..."

          # Remove problematic SecondaryIndicator usage.
          sed -i 's/TabRowDefaults\.SecondaryIndicator/TabRowDefaults.Indicator/g' "$FILE"

          # Remove tabIndicatorOffset usage completely.
          sed -i 's/\.tabIndicatorOffset([^)]*)//' "$FILE"

          echo "MainActivity fixes applied."

      - name: Enable experimental Material APIs
        run: |
          set -e

          FILE="$PROJECT_DIR/app/src/main/java/com/finephoto/editor/MainActivity.kt"

          python3 - "$FILE" <<'PY'
          import sys

          path = sys.argv[1]

          with open(path, "r", encoding="utf-8") as f:
              text = f.read()

          annotation = "@file:OptIn(androidx.compose.material.ExperimentalMaterialApi::class)"

          if annotation not in text:
              text = annotation + "\n\n" + text

          with open(path, "w", encoding="utf-8") as f:
              f.write(text)

          print("Experimental Material API enabled.")
          PY

      - name: Check source
        run: |
          echo "Checking MainActivity..."
          grep -n "ExperimentalMaterialApi\|SecondaryIndicator\|tabIndicatorOffset" \
            "$PROJECT_DIR/app/src/main/java/com/finephoto/editor/MainActivity.kt" || true

      - name: Build Debug APK
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Building project..."

          gradle --no-daemon clean assembleDebug

      - name: Verify APK
        run: |
          set -e

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo ""
          echo "======================================"
          echo "APK BUILD SUCCESSFUL"
          echo "======================================"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FinePhotoEditor-Debug
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
