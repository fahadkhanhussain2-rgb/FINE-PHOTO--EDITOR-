name: Build FINE Photo Editor

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Extract all ZIP files
        run: |
          rm -rf project
          mkdir -p project

          echo "Searching for ZIP files..."

          find . -type f -iname "*.zip" -print

          # Extract the outer ZIP
          OUTER_ZIP=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$OUTER_ZIP" ]; then
            echo "No outer ZIP found."
            exit 1
          fi

          echo "Extracting outer ZIP: $OUTER_ZIP"
          unzip -q "$OUTER_ZIP" -d project

          # Extract every ZIP found inside the extracted files
          INNER_ZIP=$(find project -type f -iname "*.zip" | head -n 1)

          if [ -n "$INNER_ZIP" ]; then
            echo "Found inner ZIP: $INNER_ZIP"
            mkdir -p project/android-project
            unzip -q "$INNER_ZIP" -d project/android-project
          fi

          echo "All extracted files:"
          find project -maxdepth 8 -type f | sort

      - name: Find Android project
        run: |
          SETTINGS=$(find project -type f -name "settings.gradle.kts" | head -n 1)

          if [ -z "$SETTINGS" ]; then
            SETTINGS=$(find project -type f -name "settings.gradle" | head -n 1)
          fi

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Android project files were not found."
            echo ""
            echo "Files extracted from ZIP:"
            find project -maxdepth 10 -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Android project found:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Check Android project
        run: |
          echo "Project directory:"
          echo "$PROJECT_DIR"

          echo ""
          echo "Project files:"
          find "$PROJECT_DIR" -maxdepth 4 -type f | sort

          echo ""
          echo "Checking required files..."

          test -f "$PROJECT_DIR/settings.gradle.kts" || \
          test -f "$PROJECT_DIR/settings.gradle"

          test -f "$PROJECT_DIR/build.gradle.kts" || \
          test -f "$PROJECT_DIR/build.gradle"

          test -f "$PROJECT_DIR/app/build.gradle.kts" || \
          test -f "$PROJECT_DIR/app/build.gradle"

          echo "Android project structure OK."

      - name: Fix unsupported Compose tab indicator
        run: |
          FILE="$PROJECT_DIR/app/src/main/java/com/finephoto/editor/MainActivity.kt"

          if [ ! -f "$FILE" ]; then
            echo "MainActivity.kt not found at expected path."
            find "$PROJECT_DIR/app/src/main/java" -type f | sort
            exit 1
          fi

          python3 <<'PY'
          import os
          import re

          project_dir = os.environ["PROJECT_DIR"]

          file_path = os.path.join(
              project_dir,
              "app/src/main/java/com/finephoto/editor/MainActivity.kt"
          )

          with open(file_path, "r", encoding="utf-8") as f:
              text = f.read()

          # Remove unsupported SecondaryIndicator usage.
          text = re.sub(
              r'\s*indicator\s*=\s*\{.*?SecondaryIndicator.*?\}',
              '',
              text,
              flags=re.S
          )

          # Remove unsupported tabIndicatorOffset lines.
          text = re.sub(
              r'(?m)^[ \t]*.*tabIndicatorOffset\(.*\)[ \t]*\n?',
              '',
              text
          )

          # Remove remaining unsupported references.
          text = text.replace(
              "TabRowDefaults.SecondaryIndicator",
              ""
          )

          text = text.replace(
              "SecondaryIndicator",
              ""
          )

          with open(file_path, "w", encoding="utf-8") as f:
              f.write(text)

          print("Compose tab indicator compatibility fix applied.")
          PY

      - name: Build Debug APK
        run: |
          cd "$PROJECT_DIR"

          echo "Building APK..."

          gradle --no-daemon clean assembleDebug

      - name: Verify APK
        run: |
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "APK was not generated."
            find "$PROJECT_DIR/app/build/outputs" -type f 2>/dev/null || true
            exit 1
          fi

          echo ""
          echo "APK BUILD SUCCESSFUL"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FinePhotoEditor-Debug
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
