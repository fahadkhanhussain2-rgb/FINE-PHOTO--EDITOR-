name: Build FINE Photo Editor APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Extract Android project
        run: |
          rm -rf project
          mkdir project
          unzip -q FINE-PHOTO-EDITOR.zip -d project

      - name: Verify project
        run: |
          echo "Project files:"
          find project -maxdepth 3 -type f | sort
          test -f project/settings.gradle.kts
          test -f project/app/build.gradle.kts

      - name: Setup Gradle 8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Build Debug APK
        working-directory: project
        run: |
          gradle --no-daemon clean assembleDebug

      - name: Verify APK
        run: |
          ls -lh project/app/build/outputs/apk/debug/
          test -f project/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FINE-PHOTO-EDITOR-Debug
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
